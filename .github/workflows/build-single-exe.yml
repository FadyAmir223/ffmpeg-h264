name: Build single Windows executable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Download current runtime bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --pattern h264-windows-x64.zip --dir $env:RUNNER_TEMP
          Copy-Item (Join-Path $env:RUNNER_TEMP 'h264-windows-x64.zip') launcher/bundle.zip
          Expand-Archive launcher/bundle.zip (Join-Path $env:RUNNER_TEMP 'bundle')

      - name: Compile and test h264.exe
        shell: pwsh
        run: |
          dotnet publish launcher/launcher.csproj -c Release -o publish
          $files = @(Get-ChildItem publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'h264.exe') { throw "Expected one EXE, found: $($files.Name -join ', ')" }
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle'
          $inputDir = Join-Path $env:RUNNER_TEMP 'input'
          $outputDir = Join-Path $env:RUNNER_TEMP 'output'
          New-Item -ItemType Directory $inputDir, $outputDir | Out-Null
          & (Join-Path $bundle 'bin/ffmpeg.exe') -nostdin -hide_banner -loglevel error -f lavfi -i 'color=c=black:s=16x16:d=0.1' -c:v libx264 -pix_fmt yuv420p (Join-Path $inputDir 'sample.mp4')
          if ($LASTEXITCODE -ne 0) { throw 'Could not create test video.' }
          "$inputDir`n$outputDir`n`n" | Set-Content (Join-Path $env:RUNNER_TEMP 'input.txt')
          $result = Start-Process -FilePath (Resolve-Path publish/h264.exe) -RedirectStandardInput (Join-Path $env:RUNNER_TEMP 'input.txt') -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'output.txt') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'error.txt') -Wait -PassThru
          Get-Content (Join-Path $env:RUNNER_TEMP 'output.txt')
          Get-Content (Join-Path $env:RUNNER_TEMP 'error.txt')
          if ($result.ExitCode -ne 0 -or -not (Test-Path (Join-Path $outputDir 'sample.mp4'))) { throw "Packaged converter failed (exit $($result.ExitCode))." }

      - name: Upload single executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 publish/h264.exe
