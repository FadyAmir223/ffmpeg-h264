name: Build single Windows executable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Assemble runtime bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -R BtbN/FFmpeg-Builds --pattern ffmpeg-master-latest-win64-gpl-shared.zip --dir $env:RUNNER_TEMP
          $unpacked = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'ffmpeg-master-latest-win64-gpl-shared.zip') $unpacked
          $sourceBin = (Get-ChildItem $unpacked -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1).DirectoryName
          if (-not $sourceBin) { throw 'FFmpeg executable is missing from the downloaded build.' }
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle'
          $bundleBin = Join-Path $bundle 'bin'
          New-Item -ItemType Directory $bundleBin | Out-Null
          Copy-Item (Join-Path $sourceBin 'ffmpeg.exe'), (Join-Path $sourceBin 'ffprobe.exe'), (Join-Path $sourceBin '*.dll') $bundleBin
          Copy-Item h264.ps1 $bundleBin
          Copy-Item (Join-Path (Split-Path $sourceBin -Parent) 'LICENSE.txt') $bundle
          Compress-Archive (Join-Path $bundle '*') launcher/bundle.zip

      - name: Compile and test h264.exe
        shell: pwsh
        run: |
          dotnet publish launcher/launcher.csproj -c Release -o publish
          $files = @(Get-ChildItem publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'h264.exe') { throw "Expected one EXE, found: $($files.Name -join ', ')" }
          $bundle = Join-Path $env:RUNNER_TEMP 'bundle'
          $inputDir = Join-Path $env:RUNNER_TEMP 'input'
          $outputDir = Join-Path $env:RUNNER_TEMP 'output'
          New-Item -ItemType Directory $inputDir, $outputDir | Out-Null
          & (Join-Path $bundle 'bin/ffmpeg.exe') -nostdin -hide_banner -loglevel error -f lavfi -i 'color=c=black:s=16x16:d=0.1' -c:v libx264 -pix_fmt yuv420p (Join-Path $inputDir 'sample.mp4')
          if ($LASTEXITCODE -ne 0) { throw 'Could not create test video.' }
          $result = Start-Process -FilePath (Resolve-Path publish/h264.exe) -ArgumentList @($inputDir, $outputDir) -Wait -PassThru
          if ($result.ExitCode -ne 0 -or -not (Test-Path (Join-Path $outputDir 'sample.mp4'))) { throw "Packaged converter failed (exit $($result.ExitCode))." }

      - name: Upload single executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1.1 publish/h264.exe --clobber
